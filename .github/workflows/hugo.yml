
name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.158.0'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Lowkey theme
        run: |
          mkdir -p site/themes
          git clone --depth 1 https://github.com/nixentric/Lowkey-Hugo-Theme.git site/themes/lowkey
          cp -R site/themes/lowkey/ExampleSite/. site/

      - name: Copy personal content
        run: |
          if [ -d content ]; then
            cp -R content/. site/content/
          fi
          if [ -d static ]; then
            mkdir -p site/static
            cp -R static/. site/static/
          fi
          if [ -f config.toml ]; then
            cp config.toml site/hugo.toml
            rm -rf site/config
          fi

      - name: Install dependencies
        working-directory: site
        run: npm install

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Hugo
        working-directory: site
        run: hugo --minify --baseURL "https://xiao1coraline.github.io/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
